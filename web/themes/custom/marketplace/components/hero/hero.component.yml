$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json

name: Marketplace Hero
description: Discovery-focused homepage hero with CTAs and imagery.

props:
  type: object
  properties:
    eyebrow:
      type: string
      title: Eyebrow text
    heading:
      type: string
      title: Heading
    description:
      type: string
      title: Description
    primary_label:
      type: string
      title: Primary button label
    primary_url:
      type: string
      title: Primary button URL
    secondary_label:
      type: string
      title: Secondary button label
    secondary_url:
      type: string
      title: Secondary button URL
    image_url:
      type: string
      title: Image URL
    image_alt:
      type: string
      title: Image alternative text