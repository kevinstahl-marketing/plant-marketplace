services:
  marketplace_auction.bid_manager:
    class: Drupal\marketplace_auction\Service\BidManager
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@datetime.time'
      - '@marketplace_auction.proxy_bid_repository'
      - '@marketplace_auction.proxy_bid_resolver'
      - '@marketplace_auction.soft_close_policy'

  marketplace_auction.lifecycle:
    class: Drupal\marketplace_auction\Service\AuctionLifecycle
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@datetime.time'
      - '@marketplace_auction.settlement_manager'

  marketplace_auction.manager:
    class: Drupal\marketplace_auction\Service\AuctionManager
    arguments:
      - '@entity_type.manager'
      - '@marketplace_seller.manager'
      - '@datetime.time'
      - '@marketplace_auction.media_manager'
      - '@database'

  marketplace_auction.media_manager:
    class: Drupal\marketplace_auction\Service\AuctionMediaManager
    arguments:
      - '@entity_type.manager'
      - '@file.validator'

  marketplace_auction.bid_history:
    class: Drupal\marketplace_auction\Service\BidHistory
    arguments:
      - '@database'

  marketplace_auction.proxy_bid_repository:
    class: Drupal\marketplace_auction\Service\ProxyBidRepository
    arguments:
      - '@database'

  marketplace_auction.proxy_bid_resolver:
    class: Drupal\marketplace_auction\Service\ProxyBidResolver

  marketplace_auction.soft_close_policy:
    class: Drupal\marketplace_auction\Service\SoftClosePolicy

  marketplace_auction.settlement_manager:
    class: Drupal\marketplace_auction\Service\AuctionSettlementManager
    arguments:
      - '@entity_type.manager'
