css:
  original: |

    .marketplace-hero {
      --forest: #203f32;
      --cream: #f3f0e6;
      --accent: #d1de82;
      background: var(--cream);
      color: var(--forest);
      overflow: hidden;
    }

    .marketplace-hero__content {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      min-height: 650px;
    }

    .marketplace-hero__intro {
      padding: clamp(32px, 5vw, 90px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 48px;
    }

    .marketplace-hero__eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    .marketplace-hero__dot {
      width: 9px;
      height: 9px;
      background: #719453;
      border-radius: 50%;
    }

    .marketplace-hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(4rem, 7.5vw, 9rem);
      line-height: 0.89;
      letter-spacing: -0.065em;
      font-weight: 400;
      max-width: 900px;
      margin: 0;
    }

    .marketplace-hero__bottom {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
    }

    .marketplace-hero__bottom p {
      max-width: 320px;
      line-height: 1.6;
      font-size: 16px;
      margin: 0;
    }

    .marketplace-hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 24px;
      padding: 17px 22px;
      background: var(--forest);
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: background 200ms, transform 200ms;
    }

    .marketplace-hero__cta:hover {
      background: #41664d;
      transform: translateY(-3px);
    }

    .marketplace-hero__visual {
      position: relative;
      min-height: 460px;
      overflow: hidden;
    }

    .marketplace-hero__visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      transition: transform 900ms ease;
    }

    .marketplace-hero__visual:hover img {
      transform: scale(1.06);
    }

    .marketplace-hero__image-label {
      position: absolute;
      bottom: 30px;
      right: 30px;
      color: white;
      font-size: 10px;
      letter-spacing: 0.2em;
      font-weight: 700;
    }

    .marketplace-hero__footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      background: var(--forest);
      color: var(--cream);
      padding: 18px 5vw;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    @media (max-width: 850px) {
      .marketplace-hero__content {
        grid-template-columns: 1fr;
      }

      .marketplace-hero__intro {
        padding: 48px 24px;
      }

      .marketplace-hero h1 {
        font-size: clamp(4rem, 13vw, 7rem);
      }

      .marketplace-hero__visual {
        min-height: 390px;
      }

      .marketplace-hero__footer {
        padding: 18px 24px;
        flex-wrap: wrap;
      }
    }
  compiled: |-
