services:
  marketplace_catalog.importer:
    class: Drupal\marketplace_catalog\Service\ShopifyProductImporter
    arguments:
      - '@entity_type.manager'
      - '@shopify_connector.admin_api'

  marketplace_catalog.reconciler:
    class: Drupal\marketplace_catalog\Service\ShopifyCatalogReconciler
    arguments:
      - '@marketplace_catalog.importer'
      - '@entity_type.manager'

  marketplace_catalog.inventory_sync:
    class: Drupal\marketplace_catalog\Service\ShopifyInventorySync
    arguments:
      - '@entity_type.manager'
      - '@shopify_connector.admin_api'
