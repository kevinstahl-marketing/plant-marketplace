  original: |

    export default function MarketplaceHero({
      eyebrow = "THE BOTANICAL MARKETPLACE",
      title = "Grow something extraordinary.",
      description = "Discover rare fruit trees, tropical plants, seeds, and everything you need to grow your own paradise.",
      buttonText = "Explore the marketplace",
      buttonUrl = "/shop",
      imageUrl = "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600"
    }) {
      return (
        <section className="marketplace-hero">
          <div className="marketplace-hero__content">
            <div className="marketplace-hero__intro">
              <span className="marketplace-hero__eyebrow">
                <span className="marketplace-hero__dot" />
                {eyebrow}
              </span>

              <h1>{title}</h1>

              <div className="marketplace-hero__bottom">
                <p>{description}</p>
                <a href={buttonUrl} className="marketplace-hero__cta">
                  {buttonText}
                  <span aria-hidden="true">↗</span>
                </a>
              </div>
            </div>

            <div className="marketplace-hero__visual">
              <img src={imageUrl} alt="Lush botanical landscape" />
              <span className="marketplace-hero__image-label">
                A WORLD OF GROWTH
              </span>
            </div>
          </div>

          <div className="marketplace-hero__footer">
            <span>PLANTS / SEEDS / FRUITS / MORE</span>
            <span>SCROLL TO EXPLORE ↓</span>
          </div>
        </section>
      );
    }
