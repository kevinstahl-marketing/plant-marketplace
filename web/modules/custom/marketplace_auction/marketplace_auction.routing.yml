marketplace_auction.detail:
  path: '/auctions/{marketplace_auction}'
  defaults:
    _controller: '\Drupal\marketplace_auction\Controller\AuctionController::view'
    _title: 'Auction'
  requirements:
    _permission: 'view marketplace auctions'
  options:
    parameters:
      marketplace_auction:
        type: entity:marketplace_auction
    no_cache: TRUE

marketplace_auction.create:
  path: '/seller/auctions/create'
  defaults:
    _form: '\Drupal\marketplace_auction\Form\AuctionCreateForm'
    _title: 'Create an auction'
  requirements:
    _permission: 'create marketplace auctions'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE
