services:
  marketplace_auction.bid_manager:
    class: Drupal\marketplace_auction\Service\BidManager
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@datetime.time'

  marketplace_auction.lifecycle:
    class: Drupal\marketplace_auction\Service\AuctionLifecycle
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@datetime.time'

  marketplace_auction.manager:
    class: Drupal\marketplace_auction\Service\AuctionManager
    arguments:
      - '@entity_type.manager'
      - '@marketplace_seller.manager'
      - '@datetime.time'
      - '@marketplace_auction.media_manager'
      - '@database'

  marketplace_auction.media_manager:
    class: Drupal\marketplace_auction\Service\AuctionMediaManager
    arguments:
      - '@entity_type.manager'
      - '@file.validator'
