marketplace_auction.settings:
  type: config_object
  label: 'Marketplace auction settings'
  mapping:
    currency:
      type: string
      label: 'Currency code'
    default_bid_increment:
      type: integer
      label: 'Default bid increment in minor currency units'
    default_duration_hours:
      type: integer
      label: 'Default auction duration in hours'
